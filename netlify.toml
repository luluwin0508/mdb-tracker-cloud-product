[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  # CloudBase SDK 只在腾讯云运行时用到（已被运行时判断包住），不让 esbuild 打包它
  external_node_modules = ["@cloudbase/node-sdk"]

# 把 /api/* 转发到 api 函数（前端用 /api/latest、/api/refresh/:section、/api/sync）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 分板块定时刷新（cron 为 UTC 时间，错峰避免同时抢函数额度）
# 新闻：快源，3 小时一次
[functions."refresh-news"]
  schedule = "0 */3 * * *"

# 制裁：全是 jina 慢源，每天两次（UTC 01:30 / 13:30 ≈ 北京 09:30 / 21:30）
[functions."refresh-sanctions"]
  schedule = "30 1,13 * * *"

# 年报：变动很少，每天一次
[functions."refresh-annual"]
  schedule = "0 2 * * *"
